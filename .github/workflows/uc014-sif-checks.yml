name: UC-014 SIF course checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "sif/**"
      - "codi-drive/web-actual/PagamentCursAutomatic.php"
      - "codi-drive/web-actual/inc/JasomNovicePaymentGate.php"
      - "codi-drive/web-actual/inc/apiRedsys.php"
      - "codi-drive/web-actual/pagina_efectuar_pagament_automatic.php"
      - "codi-drive/web-actual/realitzaPagamentAutomatic.php"
      - "codi-drive/web-actual/respostaOkPagamentAutomatic.php"
      - "codi-drive/web-actual/respostaKoPagamentAutomatic.php"
      - "codi-drive/pay-prisma-cat-canvis-verifactu/**"
      - "documentacio/06-fitxes-funcionals/uc-014.md"
      - "documentacio/07-uml-integrat/uc-014-*"
      - ".github/workflows/uc014-sif-checks.yml"
  push:
    branches:
      - main
    paths:
      - "sif/**"
      - "codi-drive/web-actual/PagamentCursAutomatic.php"
      - "codi-drive/web-actual/inc/JasomNovicePaymentGate.php"
      - "codi-drive/web-actual/inc/apiRedsys.php"
      - "codi-drive/web-actual/pagina_efectuar_pagament_automatic.php"
      - "codi-drive/web-actual/realitzaPagamentAutomatic.php"
      - "codi-drive/web-actual/respostaOkPagamentAutomatic.php"
      - "codi-drive/web-actual/respostaKoPagamentAutomatic.php"
      - "codi-drive/pay-prisma-cat-canvis-verifactu/**"
      - "documentacio/06-fitxes-funcionals/uc-014.md"
      - "documentacio/07-uml-integrat/uc-014-*"
      - ".github/workflows/uc014-sif-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uc014-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sif_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      SIF_ENV: test
      SIF_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=sif_test;charset=utf8mb4
      SIF_DB_USER: root
      SIF_DB_PASSWORD: root
      SIF_LEGACY_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=sif_legacy_test;charset=utf8mb4
      SIF_LEGACY_DB_USER: root
      SIF_LEGACY_DB_PASSWORD: root
      SIF_NOVICE_PROMO_WRAP_KEY_HEX: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      SIF_NOVICE_PROMO_KEY_VERSION: test-v1

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.4 amb extensions SIF
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, openssl, mbstring
          coverage: none

      - name: Preparar BD legacy de proves
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot \
            -e "CREATE DATABASE IF NOT EXISTS sif_legacy_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Sintaxi runner UC-014
        run: php -l sif/tests/run-uc014-tests.php

      - name: Executar suite selectiva UC-014
        run: php sif/tests/run-uc014-tests.php
