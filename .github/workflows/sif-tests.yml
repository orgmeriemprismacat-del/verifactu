name: SIF PHP MySQL tests

on:
  pull_request:
    paths:
      - "sif/**"
      - "codi-drive/web-actual/ConnexioBBDD_PreparedStatment.php"
      - "codi-drive/web-actual/ajax/enviarInscripcioPack.php"
      - "codi-drive/web-actual/js1619773569/mostrarInscripcioPack.min.js"
      - "codi-drive/web-actual/templates/inscripcions/enviamentPack.php"
      - "codi-drive/web-actual/inc/PackPaymentGate.php"
      - "codi-drive/web-actual/pagina_efectuar_pagament_grup_automatic.php"
      - "codi-drive/pay-prisma-cat-canvis-verifactu/inc/PackPaymentGate.php"
      - "codi-drive/pay-prisma-cat-canvis-verifactu/pagina_efectuar_pagament_grup_automatic.php"
      - "codi-drive/intranet-actual/LegacyDiscountValidationLookup.php"
      - "codi-drive/intranet-actual/LegacyUsocLifecycleGuard.php"
      - "codi-drive/intranet-actual/SifAuthenticatedActor.php"
      - "codi-drive/intranet-actual/SifInternalUsocClient.php"
      - "codi-drive/intranet-actual/alumnes-mostrar-alumne.php"
      - "codi-drive/intranet-actual/ajax/alumnes/sendMsgValidatCurosDescomptes.php"
      - "codi-drive/intranet-actual/ajax/alumnes/realitzarCanviCurs_CanviCurs.php"
      - "codi-drive/intranet-actual/ajax/alumnes/confirmacioBaixa_DonarBaixa.php"
      - "codi-drive/intranet-actual/js/alumnes-mostrar-alumne.js"
      - "codi-drive/intranet-actual/js/alumnes-mostrar-alumne.min.js"
      - ".github/workflows/sif-tests.yml"
  push:
    branches:
      - main
    paths:
      - "sif/**"
      - "codi-drive/web-actual/ConnexioBBDD_PreparedStatment.php"
      - "codi-drive/web-actual/ajax/enviarInscripcioPack.php"
      - "codi-drive/web-actual/js1619773569/mostrarInscripcioPack.min.js"
      - "codi-drive/web-actual/templates/inscripcions/enviamentPack.php"
      - "codi-drive/web-actual/inc/PackPaymentGate.php"
      - "codi-drive/web-actual/pagina_efectuar_pagament_grup_automatic.php"
      - "codi-drive/pay-prisma-cat-canvis-verifactu/inc/PackPaymentGate.php"
      - "codi-drive/pay-prisma-cat-canvis-verifactu/pagina_efectuar_pagament_grup_automatic.php"
      - "codi-drive/intranet-actual/LegacyDiscountValidationLookup.php"
      - "codi-drive/intranet-actual/LegacyUsocLifecycleGuard.php"
      - "codi-drive/intranet-actual/SifAuthenticatedActor.php"
      - "codi-drive/intranet-actual/SifInternalUsocClient.php"
      - "codi-drive/intranet-actual/alumnes-mostrar-alumne.php"
      - "codi-drive/intranet-actual/ajax/alumnes/sendMsgValidatCurosDescomptes.php"
      - "codi-drive/intranet-actual/ajax/alumnes/realitzarCanviCurs_CanviCurs.php"
      - "codi-drive/intranet-actual/ajax/alumnes/confirmacioBaixa_DonarBaixa.php"
      - "codi-drive/intranet-actual/js/alumnes-mostrar-alumne.js"
      - "codi-drive/intranet-actual/js/alumnes-mostrar-alumne.min.js"
      - ".github/workflows/sif-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sif-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sif_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      SIF_ENV: test
      SIF_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=sif_test;charset=utf8mb4
      SIF_DB_USER: root
      SIF_DB_PASSWORD: root
      SIF_LEGACY_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=sif_legacy_test;charset=utf8mb4
      SIF_LEGACY_DB_USER: root
      SIF_LEGACY_DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.4 amb extensions SIF
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, openssl, mbstring
          coverage: none

      - name: Preparar BD legacy de proves
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot             -e "CREATE DATABASE IF NOT EXISTS sif_legacy_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Lint UC-015 pack web flow
        run: |
          php -l codi-drive/web-actual/ConnexioBBDD_PreparedStatment.php
          php -l codi-drive/web-actual/ajax/enviarInscripcioPack.php
          php -l codi-drive/web-actual/templates/inscripcions/enviamentPack.php
          node --check codi-drive/web-actual/js1619773569/mostrarInscripcioPack.min.js
          php -l codi-drive/web-actual/inc/PackPaymentGate.php
          php -l codi-drive/web-actual/pagina_efectuar_pagament_grup_automatic.php
          php -l codi-drive/pay-prisma-cat-canvis-verifactu/inc/PackPaymentGate.php
          php -l codi-drive/pay-prisma-cat-canvis-verifactu/pagina_efectuar_pagament_grup_automatic.php

      - name: Lint UC-013 intranet USOC
        run: |
          php -l codi-drive/intranet-actual/LegacyDiscountValidationLookup.php
          php -l codi-drive/intranet-actual/LegacyUsocLifecycleGuard.php
          php -l codi-drive/intranet-actual/SifAuthenticatedActor.php
          php -l codi-drive/intranet-actual/SifInternalUsocClient.php
          php -l codi-drive/intranet-actual/alumnes-mostrar-alumne.php
          php -l codi-drive/intranet-actual/ajax/alumnes/sendMsgValidatCurosDescomptes.php
          php -l codi-drive/intranet-actual/ajax/alumnes/realitzarCanviCurs_CanviCurs.php
          php -l codi-drive/intranet-actual/ajax/alumnes/confirmacioBaixa_DonarBaixa.php
          node --check codi-drive/intranet-actual/js/alumnes-mostrar-alumne.js
          node --check codi-drive/intranet-actual/js/alumnes-mostrar-alumne.min.js

      - name: Executar suite SIF
        run: php sif/tests/run-tests.php
