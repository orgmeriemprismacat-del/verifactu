name: SIF checks

on:
  pull_request:
    paths:
      - "sif/**"
      - "codi-drive/intranet-actual/SifInternalAeatClient.php"
      - "codi-drive/intranet-actual/sif-registres-aeat.php"
      - "codi-drive/intranet-actual/ajax/sif/**"
      - "codi-drive/intranet-actual/js/sif-registres-aeat.js"
      - "codi-drive/intranet-actual/css/sif-registres-aeat.css"
      - "codi-drive/intranet-actual/SifInternalUsocClient.php"
      - "codi-drive/intranet-actual/LegacyUsocCourseChangePricingSourceInterface.php"
      - "codi-drive/intranet-actual/LegacyUsocCourseChangePricingMysqlSource.php"
      - "codi-drive/intranet-actual/LegacyUsocCourseChangePricingResolver.php"
      - "codi-drive/intranet-actual/LegacyUsocCourseChangeDestinationReservationService.php"
      - "codi-drive/intranet-actual/LegacyUsocCourseChangeDestinationMysqlStore.php"
      - "codi-drive/intranet-actual/LegacyUsocCourseChangeDestinationStoreInterface.php"
      - "codi-drive/intranet-actual/ajax/alumnes/sifUsocCourseChangePreview.php"
      - "codi-drive/intranet-actual/alumnes-usoc-financament.php"
      - "codi-drive/intranet-actual/ajax/alumnes/usocFinancament.php"
      - "codi-drive/intranet-actual/ajax/mostrarSideBarMenu.php"
      - "codi-drive/intranet-actual/js/alumnes-usoc-financament.js"
      - "codi-drive/intranet-actual/alumnes-validar-descomptes.php"
      - "codi-drive/intranet-actual/ajax/alumnes/sendMsgValidatCurosDescomptes.php"
      - "codi-drive/intranet-actual/js/alumnes-validar-descomptes.js"
      - "codi-drive/intranet-actual/js/alumnes-usoc-lifecycle-preview.js"
      - "codi-drive/intranet-actual/js/alumnes-canvi-curs-sif.js"
      - "codi-drive/web-actual/ConnexioBBDD_PreparedStatment.php"
      - "codi-drive/web-actual/EdicioPack.php"
      - "codi-drive/web-actual/Pack.php"
      - "codi-drive/web-actual/inc/buscantPacksDisponibles.php"
      - "codi-drive/web-actual/inc/PublicWebMutationAuthorization.php"
      - "codi-drive/web-actual/ajax/enviarInscripcio.php"
      - "codi-drive/web-actual/ajax/enviarInscripcio2.php"
      - "codi-drive/web-actual/ajax/enviarInscripcioAfiliat.php"
      - "codi-drive/web-actual/ajax/enviarInscripcioBescanvia.php"
      - "codi-drive/web-actual/ajax/enviarInscripcioPack.php"
      - "codi-drive/web-actual/realitzaPagamentPackAutomaticProva.php"
      - "codi-drive/web-actual/pagina_inscripcio_pack.php"
      - "codi-drive/web-actual/js1619773569/mostrarInscripcioPack.min.js"
      - "codi-drive/web-actual/templates/inscripcions/enviamentPack.php"
      - "codi-drive/web-actual/pagina_efectuar_pagament_grup_automatic.php"
      - "codi-drive/pay-prisma-cat-canvis-verifactu/pagina_efectuar_pagament_grup_automatic.php"
      - "codi-drive/web-actual/respostaOkPagamentAutomatic.php"
      - "codi-drive/web-actual/respostaKoPagamentAutomatic.php"
      - "codi-drive/web-actual/ajax/enviarInscripcioTaller.php"
      - "documentacio/05-governanca-operacio/**"
      - "documentacio/06-fitxes-funcionals/**"
      - "documentacio/07-uml-integrat/**"
      - ".github/workflows/sif-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-and-sif-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sif_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SIF_ENV: test
      SIF_DB_DSN: "mysql:host=127.0.0.1;port=3306;dbname=sif_test;charset=utf8mb4"
      SIF_DB_USER: root
      SIF_DB_PASSWORD: root
      SIF_LEGACY_DB_DSN: "mysql:host=127.0.0.1;port=3306;dbname=sif_legacy_test;charset=utf8mb4"
      SIF_LEGACY_DB_USER: root
      SIF_LEGACY_DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - name: Preparar BD legacy de proves
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS sif_legacy_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: PHP 8.2 extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, openssl, mbstring, dom, curl
          coverage: none

      - name: PHP syntax SIF
        run: find sif -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: PHP syntax UC-009 intranet
        run: |
          php -l codi-drive/intranet-actual/SifInternalAeatClient.php
          php -l codi-drive/intranet-actual/sif-registres-aeat.php
          php -l codi-drive/intranet-actual/ajax/sif/sifAeat.php

      - name: JavaScript syntax UC-009 intranet
        run: node --check codi-drive/intranet-actual/js/sif-registres-aeat.js

      - name: PHP syntax UC-013 USOC intranet
        run: |
          php -l codi-drive/intranet-actual/SifInternalUsocClient.php
          php -l codi-drive/intranet-actual/LegacyUsocCourseChangePricingSourceInterface.php
          php -l codi-drive/intranet-actual/LegacyUsocCourseChangePricingMysqlSource.php
          php -l codi-drive/intranet-actual/LegacyUsocCourseChangePricingResolver.php
          php -l codi-drive/intranet-actual/LegacyUsocCourseChangeDestinationReservationService.php
          php -l codi-drive/intranet-actual/LegacyUsocCourseChangeDestinationMysqlStore.php
          php -l codi-drive/intranet-actual/LegacyUsocCourseChangeDestinationStoreInterface.php
          php -l codi-drive/intranet-actual/ajax/alumnes/sifUsocCourseChangePreview.php
          php -l codi-drive/intranet-actual/alumnes-usoc-financament.php
          php -l codi-drive/intranet-actual/ajax/alumnes/usocFinancament.php
          php -l codi-drive/intranet-actual/ajax/mostrarSideBarMenu.php
          php -l codi-drive/intranet-actual/alumnes-validar-descomptes.php
          php -l codi-drive/intranet-actual/ajax/alumnes/sendMsgValidatCurosDescomptes.php
          php -l codi-drive/web-actual/ConnexioBBDD_PreparedStatment.php
          php -l codi-drive/web-actual/ajax/enviarInscripcio.php
          php -l codi-drive/web-actual/ajax/enviarInscripcio2.php
          php -l codi-drive/web-actual/ajax/enviarInscripcioAfiliat.php
          php -l codi-drive/web-actual/ajax/enviarInscripcioBescanvia.php
          php -l codi-drive/web-actual/ajax/enviarInscripcioPack.php
          php -l codi-drive/web-actual/ajax/enviarInscripcioTaller.php

      - name: JavaScript syntax UC-013 USOC intranet
        run: |
          node --check codi-drive/intranet-actual/js/alumnes-usoc-financament.js
          node --check codi-drive/intranet-actual/js/alumnes-validar-descomptes.js
          node --check codi-drive/intranet-actual/js/alumnes-canvi-curs-sif.js
          node --check codi-drive/intranet-actual/js/alumnes-usoc-lifecycle-preview.js

      - name: PHP and JavaScript syntax UC-015 PACK web
        run: |
          php -l codi-drive/web-actual/ConnexioBBDD_PreparedStatment.php
          php -l codi-drive/web-actual/EdicioPack.php
          php -l codi-drive/web-actual/Pack.php
          php -l codi-drive/web-actual/inc/buscantPacksDisponibles.php
          php -l codi-drive/web-actual/inc/PublicWebMutationAuthorization.php
          php -l codi-drive/web-actual/ajax/enviarInscripcioPack.php
          php -l codi-drive/web-actual/realitzaPagamentPackAutomaticProva.php
          php -l codi-drive/web-actual/pagina_inscripcio_pack.php
          php -l codi-drive/web-actual/pagina_efectuar_pagament_grup_automatic.php
          php -l codi-drive/web-actual/respostaOkPagamentAutomatic.php
          php -l codi-drive/web-actual/respostaKoPagamentAutomatic.php
          php -l codi-drive/pay-prisma-cat-canvis-verifactu/pagina_efectuar_pagament_grup_automatic.php
          php -l codi-drive/web-actual/templates/inscripcions/enviamentPack.php
          node --check codi-drive/web-actual/js1619773569/mostrarInscripcioPack.min.js

      - name: SIF test suite
        run: php sif/tests/run-tests.php
